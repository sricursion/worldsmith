name = "townforge"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Static app (Vite build output). Only /api/* runs the Worker first.
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[kv_namespaces]]
binding = "TOWNS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[ai]
binding = "AI"

# Rate Limiting binding, per IP. Wrangler 4.x spells this [[ratelimits]]; it replaces the older
# [[unsafe.bindings]] type = "ratelimit" form.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Local development: `wrangler dev --env dev` answers every model route from fixtures.
# Bindings are not inherited by environments, so they are repeated here.
[env.dev]
vars = { MOCK = "1" }

[env.dev.assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[env.dev.kv_namespaces]]
binding = "TOWNS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[env.dev.ai]
binding = "AI"

[[env.dev.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
