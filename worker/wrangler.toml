name = "worldsmith"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Static app (Vite build output). Only /api/* runs the Worker first.
[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

# Daily output-token ceilings; tune without a code change.
[vars]
BUDGET_SESSION_TOKENS = "300000"
BUDGET_IP_TOKENS = "600000"
BUDGET_GLOBAL_TOKENS = "6000000"
# Hard daily cap on generated landmarks (text-to-3D vendor tasks).
LANDMARK_DAILY_CAP = "150"

[[kv_namespaces]]
binding = "TOWNS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[ai]
binding = "AI"

# Landmark models. Optional: without it GLBs are kept in KV (under 20 MB each).
# To use R2: `npx wrangler r2 bucket create worldsmith-landmarks`, then uncomment.
# [[r2_buckets]]
# binding = "LANDMARKS"
# bucket_name = "worldsmith-landmarks"
# Secrets (never commit): `npx wrangler secret put TRIPO_API_KEY` (or MESHY_API_KEY).

# Rate Limiting binding, per IP. Wrangler 4.x spells this [[ratelimits]]; it replaces the older
# [[unsafe.bindings]] type = "ratelimit" form.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Local development: `wrangler dev --env dev` answers every model route from fixtures.
# Bindings are not inherited by environments, so they are repeated here.
[env.dev]
vars = { MOCK = "1" }

[env.dev.assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[env.dev.kv_namespaces]]
binding = "TOWNS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[env.dev.ai]
binding = "AI"

[[env.dev.ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }
